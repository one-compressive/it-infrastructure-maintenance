<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Калькулятор</title>
    <link rel="stylesheet" href="calculator.css" />
  </head>
  <body class="bg">
    <header>
      <div class="header_left">
        <img id="header_logo" src="./img/logo.png" alt="Логотип" />
      </div>
      <nav class="header_menu">
        <a class="menu_item" href="main.html">Главная</a>
        <a class="menu_item" href="calculator.html">Калькулятор</a>
        <a class="menu_item" href="author.html">Об авторе</a>
      </nav>
    </header>
    <main class="main-content">
      <div class="calculator-glass">
        <div id="result" class="result">0</div>
        <div class="keys-grid">
          <button id="btn_op_clear" class="my-btn secondary">C</button>
          <button id="btn_op_bs" class="my-btn secondary">BS</button>
          <button id="btn_op_percent" class="my-btn secondary">%</button>
          <button id="btn_op_sqrt" class="my-btn secondary">√</button>
          <button id="btn_op_div" class="my-btn primary">/</button>

          <button id="btn_digit_7" class="my-btn">7</button>
          <button id="btn_digit_8" class="my-btn">8</button>
          <button id="btn_digit_9" class="my-btn">9</button>
          <button id="btn_op_square" class="my-btn secondary">x²</button>
          <button id="btn_op_mult" class="my-btn primary">x</button>

          <button id="btn_digit_4" class="my-btn">4</button>
          <button id="btn_digit_5" class="my-btn">5</button>
          <button id="btn_digit_6" class="my-btn">6</button>
          <button id="btn_op_fact" class="my-btn secondary">x!</button>
          <button id="btn_op_minus" class="my-btn primary">-</button>

          <button id="btn_digit_1" class="my-btn">1</button>
          <button id="btn_digit_2" class="my-btn">2</button>
          <button id="btn_digit_3" class="my-btn">3</button>
          <button id="btn_digit_dot" class="my-btn secondary">.</button>
          <button id="btn_op_plus" class="my-btn primary">+</button>

          <button id="btn_digit_0" class="my-btn">0</button>
          <button id="btn_digit_000" class="my-btn">000</button>
          <button id="btn_op_sign" class="my-btn secondary">+/-</button>
          <button id="btn_op_pp" class="my-btn secondary">++</button>
          <button id="btn_op_equal" class="my-btn primary">=</button>
        </div>
      </div>

      <div id="theme-group">
        <button id="themeToggle" class="medium-btn">Сменить тему</button>
        <button id="outputToggle" class="medium-btn">✨</button>
      </div>
    </main>

    <script src="calculator.js"></script>
    <script>
      var a = document.getElementById("themeToggle");
      let theme_cnt = 1;
      a.addEventListener("click", () => {
        theme_cnt = (theme_cnt + 1) % 3;
        if (theme_cnt % 3 == 1) document.body.className = "bg";
        if (theme_cnt % 3 == 2) document.body.className = "light-theme";
        if (theme_cnt % 3 == 0) document.body.className = "dark-theme";
      });

      var b = document.getElementById("outputToggle");
      let output_cnt = 1;
      b.addEventListener("click", () => {
        output_cnt = (output_cnt + 1) % 2;
        if (output_cnt % 2 == 0)
          document.getElementById("result").className = "result";
        if (output_cnt % 2 == 1)
          document.getElementById("result").className = "glass-output";
      });
    </script>
  </body>
</html>
